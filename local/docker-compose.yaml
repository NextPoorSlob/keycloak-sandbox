services:
  database:
    image: postgres:17-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5432:5432"
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak -d keycloak" ]

  keycloak-1:
    build: .
    image: keycloak-local-auth:22.0.0
    container_name: keycloak-1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      database:
        condition: service_healthy
    command:
      - start --http-port=8080 --https-port=8443
    healthcheck:
      test: >-
        bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; 
        printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; 
        grep -q 'HTTP/1.1 200 OK' <&3'
      interval: 5s
      timeout: 5s
      retries: 5
  keycloak-2:
    build: .
    image: keycloak-local-auth:22.0.0
    container_name: keycloak-2
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8180"
      - "8543:8543"
    depends_on:
      database:
        condition: service_healthy
    command:
      - start --http-port=8180 --https-port=8543
    healthcheck:
      test: >-
        bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8180; 
        printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; 
        grep -q 'HTTP/1.1 200 OK' <&3'
      interval: 5s
      timeout: 5s
      retries: 5

  # Add a third instance if desired. Also need to add to the nginx config for load balancing.

  load-balancer:
    image: nginx:1.25-alpine
    container_name: local-auth
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/keycloak.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      keycloak-1:
        condition: service_healthy
      keycloak-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  keycloak-db-data:
